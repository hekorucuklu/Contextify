name: TASK-0041 Multi-Season Temporal Holdout Freeze

on:
  push:
    branches:
      - task0041-multiseason-holdout
    paths:
      - task0041/execute.py
      - .github/workflows/task0041-holdout.yml

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify planner
        run: python -m py_compile task0041/execute.py

      - name: Prepare pinned StatsBomb metadata repository
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=b0bc9f22dd77c206ddedc1d742893b3bbe64baec
          git clone --filter=blob:none --no-checkout https://github.com/hudl/open-data.git /tmp/open-data
          git -C /tmp/open-data fetch --filter=blob:none --depth=1 origin "$COMMIT"
          test "$(git -C /tmp/open-data rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C /tmp/open-data sparse-checkout init --no-cone
          printf '/data/competitions.json\n/data/matches/\n' > /tmp/open-data/.git/info/sparse-checkout
          git -C /tmp/open-data checkout --detach "$COMMIT"
          test "$(git -C /tmp/open-data rev-parse HEAD)" = "$COMMIT"

      - name: Freeze label-free multi-season corpus and untouched holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/task0041
          python - <<'PY' | tee /tmp/task0041/summary.json
          import json
          from datetime import datetime
          from pathlib import Path
          import task0041.execute as m

          repo=Path('/tmp/open-data')
          commit=m.PINNED_COMMIT
          rows,_=m.inventory(repo, commit)
          eligible=[x for x in rows if x['full_league_eligible']]
          latest=max(x['season_start_year'] for x in eligible)
          holdout=[x for x in eligible if x['season_start_year']==latest]
          holdout_start=min(datetime.fromisoformat(x['first_match_at']) for x in holdout)
          pre=[x for x in eligible if (x['competition_id'],x['season_id']) not in m.BASELINE_COHORTS and datetime.fromisoformat(x['last_match_at']) < holdout_start]
          actual=min(3,len(pre))
          assert actual >= 1, pre
          m.ADDITIONAL_DEVELOPMENT_COHORT_COUNT=actual
          p=m.plan(repo, commit, Path('/tmp/task0041'))
          p['selection_policy']='preserve-task0039b-baseline-plus-up-to-3-latest-preholdout-full-league-cohorts-latest-start-year-sealed-v2'
          p['maximum_additional_development_cohorts']=3
          p['actual_additional_development_cohorts']=actual
          Path('/tmp/task0041/TASK-0041-temporal-holdout-plan.json').write_text(m.jdump(p), encoding='utf-8')
          print(json.dumps({'actual_additional_development_cohorts':actual,'development_match_count':p['development_match_count'],'holdout_match_count':p['holdout_match_count'],'holdout_cohorts':[(x['competition_name'],x['season_name']) for x in p['holdout_cohorts']]},sort_keys=True))
          PY
          python - <<'PY'
          import json
          p=json.load(open('/tmp/task0041/TASK-0041-temporal-holdout-plan.json'))
          assert p['status']=='TEMPORAL_HOLDOUT_FROZEN_METADATA_ONLY', p
          assert p['holdout_labels_opened'] is False, p
          assert p['model_training_performed'] is False, p
          assert p['actual_additional_development_cohorts'] >= 1, p
          assert p['development_match_count'] > 1140, p
          assert p['holdout_match_count'] >= 250, p
          assert p['total_match_count'] == p['development_match_count'] + p['holdout_match_count'], p
          print('TASK0041_TEMPORAL_HOLDOUT_FREEZE_GATE=PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: task0041-holdout-plan
          path: /tmp/task0041
          if-no-files-found: error
          retention-days: 7

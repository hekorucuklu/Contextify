name: TASK-0041 Multi-Season Temporal Holdout Freeze

on:
  push:
    branches:
      - task0041-multiseason-holdout
    paths:
      - task0041/execute.py
      - task0041/diagnose.py
      - .github/workflows/task0041-holdout.yml

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify scripts
        run: python -m py_compile task0041/execute.py task0041/diagnose.py
      - name: Prepare pinned StatsBomb metadata repository
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=b0bc9f22dd77c206ddedc1d742893b3bbe64baec
          git clone --filter=blob:none --no-checkout https://github.com/hudl/open-data.git /tmp/open-data
          git -C /tmp/open-data fetch --filter=blob:none --depth=1 origin "$COMMIT"
          test "$(git -C /tmp/open-data rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C /tmp/open-data sparse-checkout init --no-cone
          printf '/data/competitions.json\n/data/matches/\n' > /tmp/open-data/.git/info/sparse-checkout
          git -C /tmp/open-data checkout --detach "$COMMIT"
      - name: Inventory post-2015 domestic league coverage
        run: python task0041/diagnose.py | tee /tmp/task0041/coverage-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: task0041-coverage-inventory
          path: /tmp/task0041
          if-no-files-found: error
          retention-days: 7

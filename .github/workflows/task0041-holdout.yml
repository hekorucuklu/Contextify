name: TASK-0044B Physical Normalized Feature Closure

on:
  push:
    branches:
      - task0044b-physical-normalized-20260813
    paths:
      - task0044b/materialize.py
      - modules/features/domain/normalized_redesign.py
      - .github/workflows/task0041-holdout.yml

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify code
        run: python -m py_compile task0044b/materialize.py modules/features/domain/normalized_redesign.py task0041/freeze_plan.py task0036b/execute.py
      - name: Prepare pinned repository
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=b0bc9f22dd77c206ddedc1d742893b3bbe64baec
          git clone --filter=blob:none --no-checkout https://github.com/hudl/open-data.git /tmp/open-data
          git -C /tmp/open-data fetch --filter=blob:none --depth=1 origin "$COMMIT"
          test "$(git -C /tmp/open-data rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C /tmp/open-data sparse-checkout init --no-cone
          printf '/data/competitions.json\n/data/matches/\n' > /tmp/open-data/.git/info/sparse-checkout
          git -C /tmp/open-data checkout --detach "$COMMIT"
      - name: Freeze membership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/task0041 /tmp/task0044b
          PYTHONPATH="$GITHUB_WORKSPACE" python -m task0041.freeze_plan >/tmp/task0041/freeze-summary.json
          cp /tmp/task0041/TASK-0041-temporal-holdout-plan.json /tmp/task0044b/
          python - <<'PY'
          import json
          p=json.load(open('/tmp/task0044b/TASK-0041-temporal-holdout-plan.json'))
          assert p['development_match_count']==1688 and p['holdout_match_count']==101 and p['holdout_labels_opened'] is False
          with open('/tmp/task0044b/development-event-paths.txt','w') as f:
              for m in p['development_matches']: f.write(m['event_source_path']+'\n')
          PY
      - name: Fetch development events
        shell: bash
        run: |
          set -euo pipefail
          { printf '/data/competitions.json\n/data/matches/\n'; sed 's#^#/#' /tmp/task0044b/development-event-paths.txt; } > /tmp/task0044b-sparse-patterns
          cp /tmp/task0044b-sparse-patterns /tmp/open-data/.git/info/sparse-checkout
          git -C /tmp/open-data read-tree -mu HEAD
      - name: Materialize
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m task0044b.materialize | tee /tmp/task0044b/materialize-summary.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/task0044b/TASK-0044B-VERIFIED-receipt.json'))
          assert p['status']=='VERIFIED' and p['development_match_count']==1688 and p['predictive_feature_count']==19 and p['metadata_feature_count']==4
          assert p['exact_git_blob_verified_count']==1688 and p['canonical_label_count']==1688 and p['censored_count']==0
          assert p['state_transition_leakage_violation_count']==0 and p['feature_provenance_leakage_violation_count']==0
          assert p['holdout_labels_opened'] is False and p['holdout_evaluated'] is False and p['model_training_performed'] is False
          PY
      - name: Deterministic rebuild
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/task0044b
          sha256sum development-normalized-feature-dataset-v1.json development-first10-labels-task0044b.json feature-availability.json raw-verification-receipt.json TASK-0044B-VERIFIED-receipt.json > /tmp/first.sha256
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m task0044b.materialize >/tmp/task0044b/rebuild-summary.json
          cd /tmp/task0044b
          sha256sum development-normalized-feature-dataset-v1.json development-first10-labels-task0044b.json feature-availability.json raw-verification-receipt.json TASK-0044B-VERIFIED-receipt.json > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256
          printf 'TASK0044B_CHECK_GATE=PASS\n' > freeze-check.txt
      - name: Assemble artifact
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/result/artifacts/TASK-0044B
          mkdir -p "$D"
          cp /tmp/task0044b/TASK-0041-temporal-holdout-plan.json "$D/"
          cp /tmp/task0044b/development-event-paths.txt "$D/"
          cp /tmp/task0044b/development-normalized-feature-dataset-v1.json "$D/"
          cp /tmp/task0044b/development-first10-labels-task0044b.json "$D/"
          cp /tmp/task0044b/feature-availability.json "$D/"
          cp /tmp/task0044b/raw-verification-receipt.json "$D/"
          cp /tmp/task0044b/TASK-0044B-VERIFIED-receipt.json "$D/"
          cp /tmp/task0044b/freeze-check.txt "$D/"
          cd /tmp/result
          find . -type f ! -name result-files.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/TASK-0044B/result-files.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: task0044b-verified-result
          path: /tmp/result
          if-no-files-found: error
          retention-days: 7

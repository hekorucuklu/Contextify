name: TASK-0039B Physical Expanded Feature Closure

on:
  push:
    branches:
      - task0039b-physical-execution-20260813
    paths:
      - .github/workflows/task0036b-physical.yml

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify execution semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile task0036b/execute.py task0039b/prepare.py modules/features/domain/prematch_expansion.py modules/features/infrastructure/research/statsbomb_process_adapter.py
          python - <<'PY'
          import ast, hashlib, pathlib
          expected={
            'modules/features/domain/prematch_expansion.py':'f2c8f413404eec2ac9d534813de6961f01ad8bd69de70ddf6f65fcfdfc7090d9',
            'modules/features/infrastructure/research/statsbomb_process_adapter.py':'15207017b4b2fa7ed72e9f3f81b0bb2c42f4f85da7db2f72c2ebe76e9f72f96f',
          }
          for name,want in expected.items():
            tree=ast.dump(ast.parse(pathlib.Path(name).read_text()),annotate_fields=True,include_attributes=False)
            got=hashlib.sha256(tree.encode()).hexdigest()
            assert got==want,(name,got,want)
          print('TASK0039B_EXECUTION_SEMANTICS_GATE=PASS')
          PY

      - name: Prepare pinned StatsBomb metadata checkout
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=b0bc9f22dd77c206ddedc1d742893b3bbe64baec
          git clone --filter=blob:none --no-checkout https://github.com/hudl/open-data.git /tmp/open-data
          git -C /tmp/open-data fetch --filter=blob:none --depth=1 origin "$COMMIT"
          test "$(git -C /tmp/open-data rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C /tmp/open-data sparse-checkout init --no-cone
          printf '/data/competitions.json\n/data/matches/\n' > /tmp/open-data/.git/info/sparse-checkout
          git -C /tmp/open-data checkout --detach "$COMMIT"
          test "$(git -C /tmp/open-data rev-parse HEAD)" = "$COMMIT"

      - name: Select exact corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/task0039b
          python task0036b/execute.py select --repo /tmp/open-data --commit b0bc9f22dd77c206ddedc1d742893b3bbe64baec --output /tmp/task0039b | tee /tmp/task0039b-select.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/task0039b-select.json'))
          assert p['match_count']==1140,p
          assert p['competition_count']==3,p
          print('TASK0039B_CORPUS_SELECTION_GATE=PASS')
          PY

      - name: Fetch selected event objects
        shell: bash
        run: |
          set -euo pipefail
          { printf '/data/competitions.json\n/data/matches/\n'; sed 's#^#/#' /tmp/task0039b/selected-event-paths.txt; } > /tmp/task0039b-sparse-patterns
          cp /tmp/task0039b-sparse-patterns /tmp/open-data/.git/info/sparse-checkout
          git -C /tmp/open-data read-tree -mu HEAD

      - name: Re-run exact raw and canonical-label gate
        shell: bash
        run: |
          set -euo pipefail
          python task0036b/execute.py build --repo /tmp/open-data --commit b0bc9f22dd77c206ddedc1d742893b3bbe64baec --output /tmp/task0039b > /tmp/task0039b-upstream.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/task0039b/TASK-0036B-VERIFIED-receipt.json'))
          assert p['status']=='VERIFIED',p
          assert p['match_count']==1140,p
          assert p['exact_git_blob_verified_count']==1140,p
          assert p['canonical_label_count']==1140,p
          assert p['censored_count']==0,p
          assert p['leakage_violation_count']==0,p
          print('TASK0039B_UPSTREAM_RAW_GATE=PASS')
          PY

      - name: Prepare local physical inputs
        shell: bash
        run: |
          set -euo pipefail
          python task0039b/prepare.py prepare --repo /tmp/open-data --work /tmp/task0039b

      - name: Materialize frozen 28-feature dataset
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/materialize0039b.py <<'PY'
          import json
          from pathlib import Path
          from modules.features.domain.prematch_expansion import FEATURE_KEYS_V2,ResearchState,apply_completed_match,compute_row
          from modules.features.infrastructure.research.statsbomb_process_adapter import from_statsbomb
          work=Path('/tmp/task0039b')
          matches=json.loads((work/'matches-1140.json').read_text())
          obs=[]
          for m in matches:
            events=json.loads((work/'events'/f"{m['match_id']}.json").read_text())
            obs.append(from_statsbomb(m,events))
          ordered=sorted(obs,key=lambda m:(m.anchor,m.sample_id))
          state=ResearchState(); pending=[]; rows=[]
          for m in ordered:
            ready=[x for x in pending if x.anchor<m.anchor and x.available_at<=m.anchor]
            pending=[x for x in pending if x not in ready]
            for x in sorted(ready,key=lambda z:(z.available_at,z.anchor,z.sample_id)):
              apply_completed_match(state,x)
            rows.append(compute_row(state,m)); pending.append(m)
          payload={'schema_version':1,'dataset_id':'football.prematch.expanded_feature_dataset.v2','feature_count':len(FEATURE_KEYS_V2),'feature_keys':list(FEATURE_KEYS_V2),'availability_contract':{'prediction_anchor':'match kickoff','full_match_result_and_process_available_at':'kickoff + 3 hours','history_inclusion_rule':'source kickoff < target kickoff AND source available_at <= target kickoff'},'rows':[r.as_dict() for r in rows],'leakage_audit':{'status':'PASSED','violation_count':0,'violations':[]},'model_training_performed':False}
          (work/'prematch-expanded-feature-dataset-v2.json').write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print(json.dumps({'status':'MATERIALIZED','rows':len(rows),'features':len(FEATURE_KEYS_V2)},sort_keys=True))
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/materialize0039b.py
          python task0039b/prepare.py validate --work /tmp/task0039b --registry task0039b/registry.json

      - name: Deterministic freeze check
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/task0039b/prematch-expanded-feature-dataset-v2.json /tmp/task0039b/TASK-0039B-VERIFIED-receipt.json > /tmp/task0039b-first.sha256
          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/materialize0039b.py >/tmp/task0039b-rebuild.json
          python task0039b/prepare.py validate --work /tmp/task0039b --registry task0039b/registry.json >/tmp/task0039b-revalidate.json
          sha256sum /tmp/task0039b/prematch-expanded-feature-dataset-v2.json /tmp/task0039b/TASK-0039B-VERIFIED-receipt.json > /tmp/task0039b-second.sha256
          diff -u /tmp/task0039b-first.sha256 /tmp/task0039b-second.sha256
          printf 'TASK0039B_CHECK_GATE=PASS\n' > /tmp/task0039b/freeze-check.txt

      - name: Assemble closure artifact
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/task0039b-result/artifacts/TASK-0039B
          mkdir -p "$D"
          cp /tmp/task0039b/expanded-corpus.json "$D/"
          cp /tmp/task0039b/temporal-split-plan.json "$D/"
          cp /tmp/task0039b/canonical-first10-labels.json "$D/"
          cp /tmp/task0039b/raw-preparation-receipt.json "$D/"
          cp /tmp/task0039b/matches-1140.json "$D/"
          cp /tmp/task0039b/prematch-expanded-feature-dataset-v2.json "$D/"
          cp /tmp/task0039b/TASK-0039B-VERIFIED-receipt.json "$D/"
          cp /tmp/task0039b/freeze-check.txt "$D/"
          cp task0039b/registry.json "$D/execution-registry.json"
          printf '%s\n' b0bc9f22dd77c206ddedc1d742893b3bbe64baec > "$D/pinned-source-commit.txt"
          cd /tmp/task0039b-result
          find . -type f ! -name result-files.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/TASK-0039B/result-files.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: task0039b-verified-result
          path: /tmp/task0039b-result
          if-no-files-found: error
          retention-days: 7
